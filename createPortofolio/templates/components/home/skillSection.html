{% load static %}

<!-- Skills Section -->
<section class="py-16 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8" data-aos="flip-left" data-aos-duration="1000">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
        My <span class="text-blue-600">Skills</span> & Tools
      </h2>
      <p class="text-lg text-gray-600 max-w-2xl mx-auto">
        Technologies I use to bring ideas to life
      </p>
    </div>

    <div
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 justify-center items-center"
    >
      {% for skill in skill_section %}
      <div
        class="bg-white p-6 w-48 h-48 rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 flex flex-col items-center"
      >
        <div
          class="w-14 h-14 bg-purple-100 rounded-full flex items-center justify-center mb-4"
        >
          <img
            src="{{ skill.image.url }}"
            alt="{{ skill.title }}"
            class="w-8 h-8"
          />
        </div>
        <h3 class="font-medium text-gray-900 mb-1">
          {{ skill.title }}
        </h3>
        <p class="text-sm text-gray-500 text-center">
          {{ skill.description }}
        </p>
      </div>
      {% endfor %}
    </div>

    <!-- Additional Skills -->
    <div class="mt-12 flex flex-wrap justify-center gap-3 max-w-3xl mx-auto">
      <div
        class="px-4 py-2 bg-white rounded-md border border-gray-200 shadow-xs text-sm font-medium"
      >
        Clean Design
      </div>
      <div
        class="px-4 py-2 bg-white rounded-md border border-gray-200 shadow-xs text-sm font-medium"
      >
        Tailwind CSS
      </div>
      <div
        class="px-4 py-2 bg-white rounded-md border border-gray-200 shadow-xs text-sm font-medium"
      >
        Node.js
      </div>
      <div
        class="px-4 py-2 bg-white rounded-md border border-gray-200 shadow-xs text-sm font-medium"
      >
        RESTful APIs
      </div>
      <div
        class="px-4 py-2 bg-white rounded-md border border-gray-200 shadow-xs text-sm font-medium"
      >
        Responsive Design
      </div>
    </div>
  </div>
</section>
