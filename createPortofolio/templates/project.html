{% extends "base.html" %}
{% block content %}
{% load static %}

<!-- Projects Section -->
<section class="pb-16 pt-20 bg-white" id="projects">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-10">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
        Featured <span class="text-blue-600">Projects</span>
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      {% for project in project_section %}
      <!-- Project 1 -->
      <div class="group relative overflow-hidden rounded-xl transition-all duration-300 border border-gray-100">
        <div class="h-48 overflow-hidden">
          <img src="{{ project.image.url }}" 
               alt="{{ project.title }}" 
               class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
        </div>
        <div class="p-6">
          <div class="flex items-center gap-2 mb-3">
            <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs font-medium rounded-md">{{project.framework}}</span>
            <span class="px-2 py-1 bg-purple-100 text-purple-800 text-xs font-medium rounded-md">{{project.language}}</span>
            <span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-medium rounded-md">{{project.framework}}</span>
            <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs font-medium rounded-md">{{project.status}}</span>
          </div>
          <h3 class="text-xl font-bold text-gray-900 mb-2">{{project.title}}</h3>
          <p class="text-gray-600 mb-4 line-clamp-3">{{project.description}}</p>
          <div class="flex justify-between items-center">
            <a href="{{ project.link }}" class="text-sm font-medium text-blue-600 hover:text-blue-700 flex items-center">
              {{project.textBtn}}
              <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </a>
            <a href="#" class="text-gray-400 hover:text-gray-500">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm-2 16h-2v-6h2v6zm-1-6.891c-.607 0-1.1-.496-1.1-1.109 0-.612.492-1.109 1.1-1.109s1.1.497 1.1 1.109c0 .613-.493 1.109-1.1 1.109zm8 6.891h-1.998v-2.861c0-1.881-2.002-1.722-2.002 0v2.861h-2v-6h2v1.093c.872-1.616 4-1.736 4 1.548v3.359z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
